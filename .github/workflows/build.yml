name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glfw
            file

      - name: Verify toolchain
        shell: msys2 {0}
        run: |
          which gcc
          which g++
          which make
          gcc --version
          g++ --version
          make --version

      - name: Check GLFW libraries
        shell: msys2 {0}
        run: |
          echo "===== GLFW libraries ====="
          ls -l /mingw64/lib/libglfw*
          echo ""
          echo "===== GLFW DLL ====="
          ls -l /mingw64/bin/glfw3.dll || true

      - name: Clean
        shell: msys2 {0}
        run: |
          find . -name "*.o" -delete
          rm -f app.exe

      - name: Build
        shell: msys2 {0}
        run: |
          make -f Makefile.win

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PolyAnnotator-Windows
          path: app.exe