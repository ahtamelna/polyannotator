name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glfw
            file

      - name: Verify toolchain
        shell: msys2 {0}
        run: |
          gcc --version
          g++ --version
          make --version

      - name: Clean
        shell: msys2 {0}
        run: |
          find . -name "*.o" -delete
          rm -f app.exe

      - name: Build
        shell: msys2 {0}
        run: |
          make -f Makefile.win

      - name: Show dependencies
        shell: msys2 {0}
        run: |
          echo "========== DLL Dependencies =========="
          ldd app.exe

      - name: Prepare package
        shell: msys2 {0}
        run: |
          mkdir package

          cp app.exe package/

          # Runtime DLLs
          cp /mingw64/bin/glfw3.dll package/ || true
          cp /mingw64/bin/libgcc_s_seh-1.dll package/ || true
          cp /mingw64/bin/libstdc++-6.dll package/ || true
          cp /mingw64/bin/libwinpthread-1.dll package/ || true

          # Optional libraries that may be required
          cp /mingw64/bin/libssp-0.dll package/ || true
          cp /mingw64/bin/libgcc_s_dw2-1.dll package/ || true
          cp /mingw64/bin/libbrotlicommon.dll package/ || true
          cp /mingw64/bin/libbrotlidec.dll package/ || true
          cp /mingw64/bin/libpng16-16.dll package/ || true
          cp /mingw64/bin/zlib1.dll package/ || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PolyAnnotator-Windows
          path: package